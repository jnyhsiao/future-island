<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="中山・未來嶼。預約午餐、整理升學想法，探索自己的下一步。">
  <meta name="theme-color" content="#aacbc6">
  <title>中山・未來嶼｜FUTURE ISLAND</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./assets/base.css">
  <link rel="stylesheet" href="./assets/island.css">
  <link rel="stylesheet" href="./assets/split.css">
  <link rel="stylesheet" href="./assets/island3d.css">
  <script src="./config.js" defer></script>
  <script src="./assets/links.js" defer></script>
  <script src="./assets/app.js" defer></script>
  <script src="./assets/three.min.js" defer></script>
  <script src="./assets/scene3d.js" defer></script>
  <script src="./assets/residents.js" defer></script>
  <script src="./assets/scene.js" defer></script>
</head>
<body>
<a href="#listModeBtn" class="skip-link">跳到功能清單</a>
<noscript><div class="no-js-note">這個網站需要 JavaScript。請啟用 JavaScript，或向老師索取午餐預約及升學表單的直接網址。</div></noscript>
<main id="islandHome" class="island-home" aria-label="中山・未來嶼首頁">
  <header class="island-brand"><span class="brand-symbol" aria-hidden="true">◒</span><div><strong>中山・未來嶼</strong><small>FUTURE ISLAND</small></div></header>
  <nav class="island-top-tools" aria-label="地圖顯示設定"><span id="islandDemoStamp" class="demo-stamp" hidden>離線示範・不會儲存</span><div class="time-switch" role="group" aria-label="校園時間"><button data-time="dawn" aria-label="清晨" title="清晨"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 6v3M5.5 10.5l2 1.5M18.5 10.5l-2 1.5"/></svg></button><button data-time="day" aria-label="白天" title="白天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button><button data-time="dusk" aria-label="黃昏" title="黃昏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 16h16M7 16a5 5 0 0 1 10 0M8 20h8M12 4v4l-2-2M12 8l2-2"/></svg></button><button data-time="night" aria-label="夜晚" title="夜晚"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button></div><button class="surface-btn motion-control" id="motionBtn" aria-pressed="false" title="減少水波和煙霧動畫">微風動態</button><button class="surface-btn active" id="mapModeBtn" aria-pressed="true">全校</button><button class="surface-btn" id="listModeBtn" aria-pressed="false">清單</button></nav>
  <section class="intro-panel" aria-labelledby="islandTitle"><div class="intro-eyebrow">YOUR NEXT STEP, AT YOUR OWN PACE.</div><h1 id="islandTitle">未來，<br>等你來探索。</h1><p>有空帶著你的午餐，<br>來跟老師聊聊。</p><button class="island-cta" data-zone="lunch"><span>預約午餐</span><span aria-hidden="true">↗</span></button><button class="island-chat-cta" type="button" data-chat="guide"><span aria-hidden="true">💬</span> 和校友學姊聊聊，找到妳的下一站</button><div class="intro-caption"><span>每組 1–2 人</span><span>週一・三・五</span><span>前一天截止</span></div></section>
  <div class="map-viewport" id="mapViewport" aria-label="可拖曳與縮放的校園地圖"><svg id="islandMap" class="island-map" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" aria-label="五個可點選地點的校園地圖"></svg></div>
  <aside class="trip-note"><div class="kicker" id="tripKicker">你的下一站</div><strong id="tripTitle">找個午餐時間，坐下來聊聊。</strong><p id="tripSubtitle">一位同學代表預約；每個人各填自己的升學規劃。</p><button class="tiny-action" id="tripAction">前往午餐預約 ↗</button></aside>
  <section id="zoneList" class="zone-list" hidden aria-labelledby="zoneListTitle"><h2 id="zoneListTitle">想從哪裡開始？</h2><p>不用在地圖上找路，直接前往你需要的地方。</p><div class="zone-list-grid">
    <button class="zone-list-card" data-zone="lunch"><span class="znum">01</span><span><strong>午餐小屋</strong><small>前往獨立預約頁，座號登入後分組選時間。</small></span></button>
    <button class="zone-list-card" data-zone="planning"><span class="znum">02</span><span><strong>未來羅盤</strong><small>午餐前，每個人先填一份升學規劃。</small></span></button>
    <button class="zone-list-card" data-zone="routes"><span class="znum">03</span><span><strong>科系航線</strong><small>從你想解決的問題，探索可能的方向。</small></span></button>
    <button class="zone-list-card" data-zone="workshop"><span class="znum">04</span><span><strong>學習工坊</strong><small>整理一段經驗，想好一個想聊的問題。</small></span></button>
    <button class="zone-list-card" data-zone="resources"><span class="znum">05</span><span><strong>資源燈塔</strong><small>查科系、看招生資訊，從官方資料出發。</small></span></button>
  </div></section>
  <div class="map-controls" aria-label="地圖縮放"><button id="zoomIn" aria-label="放大地圖">＋</button><button id="zoomOut" aria-label="縮小地圖">−</button><button id="resetView" aria-label="回到全校視角" title="回到全校視角">⌖</button></div>
  <div class="map-legend"><b>ZHONGSHAN · FUTURE ISLAND</b><span>拖曳移動 · 點地標探索 · <span id="zoomReadout">100%</span></span></div>
  <nav class="island-dock" aria-label="主要功能">
    <button data-zone="lunch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/><path d="M8 5V2"/></svg><span>預約午餐</span></button>
    <button data-zone="planning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6Z"/></svg><span>升學規劃</span></button>
    <button data-zone="routes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15M15 6v15"/></svg><span>科系探索</span></button>
    <button data-zone="workshop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>學習準備</span></button>
    <button data-zone="resources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 21h14M8 21l1-13h6l1 13M8 8h8M9 4h6v4H9ZM7 3 4 1M17 3l3-2M3 7h3M18 7h3M12 1v3"/></svg><span>資源入口</span></button>
    <button class="dock-chat" type="button" data-chat="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>問學姊</span></button><span class="dock-divider" aria-hidden="true"></span><button class="dock-home" id="myBookingShortcut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v5M16 3v5M4 10h16m-12 5 3 3 5-5"/></svg><span>我的預約</span></button>
  </nav><div class="island-footer"><span>© CSGHS YuHsuan Hsiao</span></div>
</main>
<dialog class="island-dialog info-dialog" id="infoDialog" aria-labelledby="infoTitle"><button class="dialog-close" data-close="infoDialog" aria-label="關閉說明">×</button><div id="infoBody"></div></dialog>

</body>
</html>
